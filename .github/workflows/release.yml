# Portable builds: one file (or one app) per system, no installer.
#   Linux:   porchly-linux-x64            (a single program)
#   Windows: porchly-windows-x64.zip      (porchly.exe; the C runtime is built in)
#   macOS:   porchly-macos.zip            (Porchly.app, Apple silicon and Intel)
# Each also has porchly-cli. Runs on a version tag (v0.2.0), which publishes a GitHub release,
# or by hand from the Actions tab (the files are then attached to the run only).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # an older Linux, so the program runs on older systems too
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p porchly -p porchly-cli
      - run: |
          mkdir dist
          cp target/release/porchly dist/porchly-linux-x64
          cp target/release/porchly-cli dist/porchly-cli-linux-x64
          chmod +x dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p porchly -p porchly-cli
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/porchly.exe pkg/
          Copy-Item target/release/porchly-cli.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath dist/porchly-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release -p porchly -p porchly-cli --target aarch64-apple-darwin
          cargo build --release -p porchly -p porchly-cli --target x86_64-apple-darwin
      - name: Make Porchly.app (one app for Apple silicon and Intel)
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist Porchly.app/Contents/MacOS
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > Porchly.app/Contents/Info.plist
          # The icon, in every size macOS wants.
          mkdir -p Porchly.iconset Porchly.app/Contents/Resources
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/brand/porchly-icon-1024.png --out Porchly.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/brand/porchly-icon-1024.png --out Porchly.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns Porchly.iconset -o Porchly.app/Contents/Resources/Porchly.icns
          lipo -create -output Porchly.app/Contents/MacOS/porchly \
            target/aarch64-apple-darwin/release/porchly target/x86_64-apple-darwin/release/porchly
          lipo -create -output porchly-cli \
            target/aarch64-apple-darwin/release/porchly-cli target/x86_64-apple-darwin/release/porchly-cli
          # Not notarized: signed "ad hoc", which Apple silicon requires to run at all.
          codesign --force --deep --sign - Porchly.app
          codesign --force --sign - porchly-cli
          ditto -c -k --keepParent Porchly.app dist/porchly-macos.zip
          ditto -c -k porchly-cli dist/porchly-cli-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
