[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/YasserManss/porchly"

[workspace.dependencies]
# internal
porchly-core = { path = "crates/core" }
porchly-schema = { path = "crates/schema" }
porchly-store = { path = "crates/store" }
porchly-api = { path = "crates/api" }
porchly-functions = { path = "crates/functions" }
porchly-fetch = { path = "crates/fetch" }
porchly-tunnel = { path = "crates/tunnel" }
porchly-engine = { path = "crates/engine" }
porchly-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
getrandom = "0.4"
data-encoding = "2"
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

# server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "process", "io-util", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"

# functions runtime download
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tower = { version = "0.5", features = ["util"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11", "links"] }
egui_kittest = "0.36"
rfd = "0.17"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# cli
clap = { version = "4", features = ["derive"] }

# tests
tempfile = "3"
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# Smaller downloads; Porchly never shows panics' backtraces to people anyway.
strip = true
